<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación completada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px 60px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4ecca3, #2ecc71);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
            animation: scaleIn 0.5s ease-out;
        }
        @keyframes scaleIn {
            0% { transform: scale(0); }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #4ecca3;
        }
        p {
            color: #b0b0b0;
            line-height: 1.6;
            margin: 5px 0;
        }
        .loader {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #4ecca3;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .footer { margin-top: 20px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✓</div>
        <h1>¡Verificación completada!</h1>
        <p>El bot se ha añadido al servidor correctamente.</p>
        <p>Redirigiendo a Discord...</p>
        <div class="loader"></div>
        <div class="footer">Discord Verification System v3.2.1</div>
    </div>
    <script>
        setTimeout(function() {
            window.location.href = "https://discord.com/channels/@me";
        }, 3000);
    </script>
</body>
</html>te
